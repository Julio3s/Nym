services:
  - type: web
    name: mny-backend
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    repo: https://github.com/Julio3s/Nym
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && exec gunicorn config.wsgi:application --log-file -
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: mny-backend-zcme.onrender.com,localhost,127.0.0.1,.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://mny-frontend-ho4i.onrender.com,http://localhost:5173,http://localhost:3000
      - key: CORS_ALLOW_ALL_ORIGINS
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: mny-db
          property: connectionString

  - type: web
    name: mny-frontend
    runtime: static
    branch: main
    repo: https://github.com/Julio3s/Nym
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://mny-backend-zcme.onrender.com/api

databases:
  - name: mny-db
    plan: free
    region: frankfurt
