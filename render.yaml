services:
  - type: web
    name: mny-backend
    env: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash -lc "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --log-file -"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: "mny-backend.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: True
      - key: DATABASE_URL
        fromDatabase:
          name: mny-db

  - type: static_site
    name: mny-frontend
    region: frankfurt
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://mny-backend.onrender.com/api

databases:
  - name: mny-db
    engine: postgresql
    plan: starter
    region: frankfurt
